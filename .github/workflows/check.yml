name: Check
on:
  pull_request:
  push:
    branches: [main, dev]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      BROWSER_TEST_BASE: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - id: browser
        run: |
          suites=$(node scripts/test-browser.mjs --list)
          if [ -n "$suites" ]; then echo "required=true" >> "$GITHUB_OUTPUT"; fi
          echo "Browser suites: $suites"
      - if: steps.browser.outputs.required == 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.browser.outputs.required == 'true'
        run: npm run test:browser
